[project]
name = "retail-gamma"
version = "0.1.0"
description = "Retail Flow-Induced Gamma Dislocation (RFGD) systematic strategy pipeline"
requires-python = ">=3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.17.1",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retail_gamma"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=retail_gamma --cov-report=term-missing"
