[project]
name = "retail-gamma"
version = "0.2.0"
description = "Retail Flow-Induced Gamma Dislocation (RFGD) systematic strategy pipeline"
requires-python = ">=3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "plotly>=5.22",
    "kaleido>=0.2.1",
    "yfinance>=0.2.40",
    "ipykernel>=7.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retail_gamma"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=retail_gamma --cov-report=term-missing"
